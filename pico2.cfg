# OpenOCD setup for a Pico 2 (RP2350) with the Raspberry Pi Debug Probe.
# The Makefile uses it for flash-* and halt-*. By hand:
#   openocd -s <OpenOCD's scripts dir> -f pico2.cfg -c init -c use_running_core -c "<commands>"
#
# USE_CORE picks the cores OpenOCD talks to: cm0 = Arm core 0, rv0 = RISC-V
# core 0. With both, OpenOCD flashes through whichever one the chip is
# running, so ARM and RISC-V images can be flashed one after the other.

source [find interface/cmsis-dap.cfg]
set USE_CORE { cm0 rv0 }
source [find target/rp2350.cfg]
adapter speed 5000

# Run after init. Makes the core the chip is running the current target:
# flash commands only use the current target's flash bank, and OpenOCD
# otherwise stays on cm0 even when the chip runs RISC-V.
proc use_running_core {} {
	foreach t [target names] {
		if { [target_present $t] } {
			targets $t
			return
		}
	}
}